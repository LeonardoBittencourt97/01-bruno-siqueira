<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Escritório de Advocacia Bruno Siqueira</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
      a { color: inherit; text-decoration: none; }
      .container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
      .code { font-size: 6rem; font-weight: 700; background: linear-gradient(to right, #fff, #9b9b9b); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
      .msg { font-size: 1.125rem; color: #9b9b9b; margin: 1rem 0 2rem; }
      .btn { display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 9999px; background: #C9A961; padding: 0.5rem 1.25rem; font-size: 1rem; font-weight: 600; color: #000; transition: filter 0.2s; }
      .btn:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="code">404</p>
      <p class="msg">Página não encontrada</p>
      <a href="/" class="btn">Voltar para o início</a>
    </div>
  </body>
</html>
